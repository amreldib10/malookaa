<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hii Malookaa 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffe3ec; --bg2:#ffc2d6; --card:rgba(255,255,255,.74); --ink:#6b1e3b; --muted:#a2587a;
  --accent:#e63e7a; --accent2:#ff7aa8; --shadow:rgba(230,62,122,.28); --no:#fff; --noink:#a2587a;
  --field:#fff; --line:rgba(162,88,122,.3);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a0f1d; --bg2:#4a1530; --card:rgba(60,20,40,.75); --ink:#ffd9e6; --muted:#e59ab9;
    --accent:#ff5c93; --accent2:#ff8db3; --shadow:rgba(255,92,147,.3); --no:#3a1428; --noink:#e59ab9;
    --field:#3a1428; --line:rgba(229,154,185,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg1:#2a0f1d; --bg2:#4a1530; --card:rgba(60,20,40,.75); --ink:#ffd9e6; --muted:#e59ab9;
  --accent:#ff5c93; --accent2:#ff8db3; --shadow:rgba(255,92,147,.3); --no:#3a1428; --noink:#e59ab9;
  --field:#3a1428; --line:rgba(229,154,185,.35);
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 20% 15%,var(--bg2),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));
  background-color:var(--bg1);color:var(--ink);
  font-family:'Playfair Display',Georgia,'Times New Roman',serif;overflow-x:hidden;
}
.hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.hearts span{position:absolute;bottom:-40px;opacity:0;animation:floatUp linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.7}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.card{
  position:relative;z-index:2;width:100%;max-width:460px;text-align:center;
  background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.5);border-radius:32px;padding:30px 24px 28px;
  box-shadow:0 20px 60px var(--shadow);
}
.eyebrow{font-family:'Dancing Script',cursive,Georgia,serif;font-size:1.35rem;color:var(--muted);margin:0 0 10px}
.pic-wrap{display:flex;justify-content:center;margin:2px 0 14px}
.pic{
  width:190px;height:190px;object-fit:cover;border-radius:28px;border:5px solid #fff;
  box-shadow:0 14px 30px var(--shadow);animation:wiggle 2.6s ease-in-out infinite;display:block;
}
.pic.pop{animation:pop .7s cubic-bezier(.2,1.6,.4,1), sway 3s ease-in-out .7s infinite}
.pic.small{width:130px;height:130px;border-radius:22px}
@keyframes wiggle{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.04)}}
@keyframes sway{0%,100%{transform:rotate(-2deg) scale(1.03)}50%{transform:rotate(2deg) scale(1.08)}}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
h1,h2{line-height:1.25;margin:6px 0 10px;font-weight:600}
h1{font-size:clamp(1.5rem,6vw,2rem)}
h2{font-size:clamp(1.4rem,5.5vw,1.8rem)}
.name{font-family:'Dancing Script',cursive,Georgia,serif;font-size:1.35em;color:var(--accent);display:block;line-height:1.1}
.sub{color:var(--muted);margin:0 0 22px;font-size:1rem;min-height:1.5em}
.btns{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:64px}
button{font-family:inherit;font-size:1.1rem;font-weight:600;border:0;border-radius:999px;cursor:pointer;padding:15px 34px;transition:transform .2s, box-shadow .2s}
.yes{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;box-shadow:0 10px 24px var(--shadow)}
.yes:hover{transform:translateY(-2px) scale(1.05)}
.no{background:var(--no);color:var(--noink);box-shadow:0 6px 16px rgba(0,0,0,.1);border:1px solid var(--line)}
.no.runaway{position:fixed;z-index:20;transition:left .22s ease-out, top .22s ease-out}
.confetti{position:fixed;top:-20px;font-size:26px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.9}}
.hidden{display:none}

/* picker page */
.group{text-align:left;margin:16px 0 0}
.group>label,.group>.lab{display:block;font-family:'Dancing Script',cursive,Georgia,serif;font-size:1.3rem;color:var(--accent);margin-bottom:6px}
input[type=date],input[type=time],textarea{
  width:100%;font-family:inherit;font-size:1rem;color:var(--ink);background:var(--field);
  border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;outline:none;
}
input:focus,textarea:focus{border-color:var(--accent)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  font-size:.95rem;font-weight:500;padding:10px 14px;border-radius:999px;background:var(--field);color:var(--ink);
  border:1.5px solid var(--line);box-shadow:none;
}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-color:transparent;transform:scale(1.04)}
.confirm{margin-top:22px;width:100%}
.err{color:var(--accent);min-height:1.3em;margin:10px 0 0;font-size:.95rem}
.summary{background:var(--field);border:1.5px dashed var(--line);border-radius:20px;padding:16px;margin:16px 0;text-align:left;line-height:1.7}
.summary b{color:var(--accent)}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.ghost{background:var(--no);color:var(--noink);border:1px solid var(--line)}
a.btnlink{display:block;text-decoration:none;text-align:center}
</style>
</head>

  /* floating hearts */
  var hearts=$('hearts'), glyphs=['💗','💕','💖','🌸','🤍'];
  for(var i=0;i<18;i++){
    var s=document.createElement('span');
    s.textContent=glyphs[i%glyphs.length];
    s.style.left=(Math.random()*100)+'%';
    s.style.fontSize=(14+Math.random()*22)+'px';
    s.style.animationDuration=(9+Math.random()*10)+'s';
    s.style.animationDelay=(-Math.random()*14)+'s';
    hearts.appendChild(s);
  }

  function confetti(n){
    var bits=['💖','💕','🌹','✨','💗','🎊','🌸'];
    for(var i=0;i<n;i++){(function(i){setTimeout(function(){
      var c=document.createElement('span');
      c.className='confetti';
      c.textContent=bits[Math.floor(Math.random()*bits.length)];
      c.style.left=(Math.random()*100)+'%';
      c.style.animationDuration=(2.5+Math.random()*2.5)+'s';
      c.style.fontSize=(18+Math.random()*20)+'px';
      document.body.appendChild(c);
      setTimeout(function(){c.remove()},5500);
    },i*55)})(i)}
  }

  /* ---------- NO button runs away from the pointer ---------- */
  var running=false, dodges=0;
  var lines=['Nope, not that one 😏','Too slow! 💨','You can’t catch me 🏃','Just press Yes 🥺','Pretty please? 💕','Okay okay, Yes is right there 👉'];

  function startRunning(){
    if(running) return;
    running=true;
    var r=no.getBoundingClientRect();
    // keep layout from collapsing, then take the button out of flow
    var ph=document.createElement('span');
    ph.style.cssText='display:inline-block;width:'+r.width+'px;height:'+r.height+'px';
    no.parentNode.insertBefore(ph,no);
    no.classList.add('runaway');
    no.style.left=r.left+'px';
    no.style.top=r.top+'px';
  }

  function dodge(px,py){
    startRunning();
    var w=no.offsetWidth, h=no.offsetHeight, pad=12;
    var vw=window.innerWidth, vh=window.innerHeight;
    var best=null, bestD=-1;
    for(var i=0;i<14;i++){
      var x=pad+Math.random()*(vw-w-pad*2);
      var y=pad+Math.random()*(vh-h-pad*2);
      var d=Math.hypot(x+w/2-px,y+h/2-py);
      if(d>bestD){bestD=d;best={x:x,y:y}}
    }
    no.style.left=best.x+'px';
    no.style.top=best.y+'px';
    dodges++;
    sub.textContent=lines[Math.min(dodges-1,lines.length-1)];
    yes.style.transform='scale('+Math.min(1+dodges*0.06,1.45)+')';
  }

  // fires when the pointer gets near the button, or when it is pressed/touched
  document.addEventListener('pointermove',function(e){
    if(!$('pageAsk').classList.contains('hidden')){
      var r=no.getBoundingClientRect();
      var cx=r.left+r.width/2, cy=r.top+r.height/2;
      if(Math.hypot(e.clientX-cx,e.clientY-cy)<Math.max(r.width,r.height)*0.9+30){
        dodge(e.clientX,e.clientY);
      }
    }
  });
  ['pointerdown','touchstart','click'].forEach(function(ev){
    no.addEventListener(ev,function(e){
      e.preventDefault();
      var p=(e.touches&&e.touches[0])||e;
      dodge(p.clientX||0,p.clientY||0);
    },{passive:false});
  });
  window.addEventListener('resize',function(){
    if(running){
      var r=no.getBoundingClientRect();
      no.style.left=Math.max(8,Math.min(r.left,window.innerWidth-r.width-8))+'px';
      no.style.top=Math.max(8,Math.min(r.top,window.innerHeight-r.height-8))+'px';
    }
  });

  /* ---------- YES: swap picture, then go to the picker page ---------- */
  yes.addEventListener('click',function(){
    yes.disabled=true;
    pic.src=IMG2;
    pic.alt='a happy couple';
    pic.className='pic pop';
    document.querySelector('#pageAsk h1').innerHTML='<span class="name">Yayyy! 🎉</span>I knew you’d say yes 💕';
    sub.textContent='Let’s pick the perfect date…';
    no.style.display='none';
    $('btns').style.visibility='hidden';
    confetti(45);
    setTimeout(function(){
      $('pageAsk').classList.add('hidden');
      $('pagePick').classList.remove('hidden');
      window.scrollTo(0,0);
    },1700);
  });

  /* ---------- picker page ---------- */
  var d=$('d');
  var now=new Date();
  var pad2=function(n){return (n<10?'0':'')+n};
  d.min=now.getFullYear()+'-'+pad2(now.getMonth()+1)+'-'+pad2(now.getDate());

  var chosen=null;
  var chips=[].slice.call(document.querySelectorAll('#vibe .chip'));
  chips.forEach(function(c){
    c.addEventListener('click',function(){
      chips.forEach(function(x){x.setAttribute('aria-pressed','false')});
      c.setAttribute('aria-pressed','true');
      chosen=c.textContent.trim();
    });
  });

  function prettyDate(v){
    var p=v.split('-');
    var dt=new Date(+p[0],+p[1]-1,+p[2]);
    return dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  }
  function prettyTime(v){
    var p=v.split(':'), h=+p[0], m=p[1];
    return (h%12||12)+':'+m+' '+(h>=12?'PM':'AM');
  }
  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  $('confirm').addEventListener('click',function(){
    var err=$('err');
    if(!d.value){err.textContent='Pick a day first 💗';return}
    if(!$('t').value){err.textContent='Pick a time too 🕰️';return}
    err.textContent='';
    var dayTxt=prettyDate(d.value), timeTxt=prettyTime($('t').value);
    $('summary').innerHTML='📅 <b>'+esc(dayTxt)+'</b><br>🕰️ <b>'+esc(timeTxt)+'</b><br>🍕🍵 <b>Pizza &amp; matcha date</b>';
    var msg='Yes! 💕 Our pizza & matcha date: '+dayTxt+' at '+timeTxt+' 🍕🍵🥰';
    $('wa').href='https://wa.me/?text='+encodeURIComponent(msg);
    $('pickForm').classList.add('hidden');
    $('done').classList.remove('hidden');
    window.scrollTo(0,0);
    confetti(50);
  });
  $('edit').addEventListener('click',function(){
    $('done').classList.add('hidden');
    $('pickForm').classList.remove('hidden');
  });
})();
</script>
</body>
</html>
